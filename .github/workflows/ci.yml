name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each service against a stub of its neighbours. Fast, and blind by
  # construction to anything that depends on how a real dependency behaves.
  unit:
    name: Unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The compose file interpolates the signing keypair, and every service
      # that verifies an assertion needs the public half. Generated per run:
      # a key committed to a repository is a key someone eventually funds.
      - name: Generate a signing keypair
        run: make keys ENV_FILE=$RUNNER_TEMP/env

      - name: Go, TypeScript, and PHP suites
        run: make test-docker ENV_FILE=$RUNNER_TEMP/env

  # The tier that fails when the demo does not work. Unit suites cannot catch a
  # wrong belief about a real dependency, because the code and the stub then
  # encode the same mistake and agree with each other. This runs the documented
  # first-run path against real containers and asserts on what comes back.
  smoke:
    name: Out-of-the-box run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # OpenSearch refuses to start without it, and the runner default is far
      # below what a single node needs.
      - name: Raise vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Generate a signing keypair
        run: make keys ENV_FILE=$RUNNER_TEMP/env

      - name: Clean start through to verification
        run: make smoke-cold ENV_FILE=$RUNNER_TEMP/env

      # Compose swallows a crashed dependency behind whatever error the caller
      # happened to see, so the logs matter more than the failure line.
      - name: Service logs
        if: failure()
        run: make logs-once ENV_FILE=$RUNNER_TEMP/env

      - name: Tear down
        if: always()
        run: make clean ENV_FILE=$RUNNER_TEMP/env

  # The regression suite, in a container so the runner needs no browser
  # libraries and no Cypress binary of its own. Separate from the smoke gate
  # because it seeds a full catalog and takes minutes rather than seconds.
  e2e:
    name: Cypress regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Raise vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Generate a signing keypair
        run: make keys ENV_FILE=$RUNNER_TEMP/env

      - name: Use the Node the manifests require
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cypress-tests/package-lock.json

      # Lint, formatting, and types need no browser, so they fail fast before
      # anything spends minutes seeding a catalog.
      #
      # The binary stays undownloaded here for the same reason
      # docker/cypress.Dockerfile skips it: the specs run inside
      # cypress/included, which already carries it. Downloading it anyway put a
      # vendor CDN on the critical path of every run, and a 502 from that CDN
      # failed the job before a single spec started.
      - name: Verify the suite itself
        working-directory: cypress-tests
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci && npm run verify

      - name: Seed and run the suite
        run: make e2e-cold ENV_FILE=$RUNNER_TEMP/env

      - name: Screenshots from failed specs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress-tests/cypress/screenshots
          if-no-files-found: ignore

      - name: Service logs
        if: failure()
        run: make logs-once ENV_FILE=$RUNNER_TEMP/env

      - name: Tear down
        if: always()
        run: make clean ENV_FILE=$RUNNER_TEMP/env
