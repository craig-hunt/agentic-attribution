# Everything the demo needs, on one machine. No account, no credential, no
# wallet, no funded testnet balance, no hosted dependency. See ADR-0007.

name: agentic-attribution

x-go-build: &go-build
  build:
    context: .
    dockerfile: docker/go.Dockerfile

x-node-build: &node-build
  build:
    context: .
    dockerfile: docker/node.Dockerfile

x-attribution-keys: &attribution-keys
  ATTRIBUTION_PUBLIC_KEY: ${ATTRIBUTION_PUBLIC_KEY:?run `make keys` first}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports:
      - "5432:5432"
    volumes:
      # Files here run once on an empty data directory, in filename order, so
      # the schema and indexes land before anything connects.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 3s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      # Security off for a local demo only. Nothing here listens beyond the
      # host, and enabling it would put a credential between a reviewer and
      # their first successful run.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # 1g is not enough. Neural ingest runs ONNX inference inside the cluster,
      # so a bulk batch holds the request, the generated vectors, the HNSW
      # graph under construction, and the indexing buffer at once. With
      # refresh_interval at -1 that buffer keeps growing, and the node exits
      # with a fatal OutOfMemoryError partway through the catalog. Ingest then
      # reports an EOF on _bulk, which describes the symptom rather than the
      # cause. Override on a constrained machine and seed a smaller catalog:
      #   OPENSEARCH_HEAP=1g make seed CANONICAL_PRODUCTS=5000
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Two one-shot stages rather than one shell pipeline. The Go image is
  # distroless and carries no shell, which is the point of choosing it, so
  # chaining with && is not available and compose sequences them instead.
  generate:
    <<: *go-build
    profiles: ["seed"]
    command:
      - generator
      - --seed=42
      - --canonical=${CANONICAL_PRODUCTS:-20000}
      - --out=/seed
    volumes:
      - seed-data:/seed

  # Bulk-loads Postgres through a staging table and an atomic partition swap,
  # then builds a versioned OpenSearch index and swaps the alias onto it.
  # Exits when the index is live.
  ingest:
    <<: *go-build
    profiles: ["seed"]
    command:
      - ingest
      - --seed=/seed
    environment:
      POSTGRES_DSN: postgres://agentic:agentic@postgres:5432/agentic?sslmode=disable
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - seed-data:/seed
    depends_on:
      generate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }

  search:
    <<: *go-build
    command: ["search"]
    environment:
      <<: *attribution-keys
      ATTRIBUTION_PRIVATE_KEY: ${ATTRIBUTION_PRIVATE_KEY:?run `make keys` first}
      POSTGRES_DSN: postgres://agentic:agentic@postgres:5432/agentic?sslmode=disable
      OPENSEARCH_URL: http://opensearch:9200
      SEARCH_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }

  settlement:
    <<: *go-build
    command: ["settlement"]
    environment:
      # Only the public half. Settlement verifies and never mints, so nothing it
      # can read lets it forge an assertion.
      <<: *attribution-keys
      POSTGRES_DSN: postgres://agentic:agentic@postgres:5432/agentic?sslmode=disable
      SETTLEMENT_ADDR: ":8082"
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-http://facilitator:8095}
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }

  facilitator:
    <<: *node-build
    command: ["npx", "tsx", "facilitator/src/index.ts"]
    environment:
      FACILITATOR_PORT: "8095"
    ports:
      - "8095:8095"

  merchant:
    <<: *node-build
    command: ["npx", "tsx", "merchant/src/index.ts"]
    environment:
      <<: *attribution-keys
      # Unset means the simulated merchant sells any product in the catalog.
      MERCHANT_ID: ${MERCHANT_ID:-}
      MERCHANT_PORT: "8090"
      MERCHANT_PAY_TO_ADDRESS: ${MERCHANT_PAY_TO_ADDRESS:-0x1111111111111111111111111111111111111111}
      POSTGRES_DSN: postgres://agentic:agentic@postgres:5432/agentic?sslmode=disable
      SETTLEMENT_URL: http://settlement:8082
    ports:
      - "8090:8090"
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    <<: *node-build
    command: ["npx", "tsx", "gateway/src/node.ts"]
    environment:
      <<: *attribution-keys
      GATEWAY_PORT: "8080"
      SEARCH_URL: http://search:8081
      MERCHANT_URL: http://merchant:8090
      # The edge refuses forged and expired assertions, so without this those
      # refusals would never reach a service that could record them.
      SETTLEMENT_URL: http://settlement:8082
    ports:
      - "8080:8080"

  # Runs a live agent population on demand so the dashboard has something to
  # show without anyone opening a terminal. Every agent it starts drives the
  # real path end to end: gateway, search, 402, signature, facilitator,
  # settlement, ledger.
  #
  # Its control endpoints carry no authentication. Acceptable for a service
  # reachable only from this compose network on one machine, and unacceptable
  # anywhere else, so the port stays unpublished. Only the dashboard proxies to
  # it, which keeps the browser same-origin and keeps the driver off the host.
  driver:
    <<: *node-build
    command: ["npx", "tsx", "simulator/src/driver.ts"]
    environment:
      DRIVER_PORT: "8096"
      GATEWAY_URL: http://gateway:8080
      SETTLEMENT_URL: http://settlement:8082

  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: runtime
    environment:
      SETTLEMENT_URL: http://settlement:8082
      DRIVER_URL: http://driver:8096
      FACILITATOR_URL: http://facilitator:8095
    ports:
      - "8000:8000"

  # Runs the whole loop and exits. Profiled so `docker compose up` brings up the
  # services without immediately driving a purchase through them.
  simulator:
    <<: *node-build
    profiles: ["demo"]
    command: ["npx", "tsx", "simulator/src/index.ts"]
    environment:
      GATEWAY_URL: http://gateway:8080
      DEMO_QUERY: ${DEMO_QUERY:-trail running shoes}
      DEMO_PUBLISHER_ID: ${DEMO_PUBLISHER_ID:-pub_000001}

  # Drives the running system and asserts on what it returns. The unit suites
  # test each service against a stub of its neighbours, which cannot catch a
  # wrong belief about a real dependency: the code and the stub then encode the
  # same mistake and agree with each other. This is the tier that fails when
  # the demo does not work.
  smoke:
    <<: *node-build
    profiles: ["smoke"]
    command: ["npx", "tsx", "simulator/src/smoke.ts"]
    environment:
      GATEWAY_URL: http://gateway:8080
      SEARCH_URL: http://search:8081
      SETTLEMENT_URL: http://settlement:8082
      DASHBOARD_URL: http://app:8000
      DEMO_QUERY: ${DEMO_QUERY:-trail running shoes}
      DEMO_PUBLISHER_ID: ${DEMO_PUBLISHER_ID:-pub_000001}

  # The end-to-end regression suite, on the compose network so a reviewer needs
  # only Docker. Reaches services by name rather than through published ports,
  # which is also how it reaches the driver: that service publishes no port and
  # the dashboard proxies to it.
  #
  # Authoring specs happens either on the host or through the e2e-open profile
  # below, both of which give a runner and time travel.
  # cypress-tests/README.md covers the layering and the conventions.
  cypress:
    build:
      context: .
      dockerfile: docker/cypress.Dockerfile
    profiles: ["e2e"]
    environment:
      CYPRESS_DASHBOARD_BASE_URL: http://app:8000
      CYPRESS_GATEWAY_BASE_URL: http://gateway:8080
      CYPRESS_SETTLEMENT_BASE_URL: http://settlement:8082
    shm_size: 2gb
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }

  # The same image, showing its browser instead of hiding it.
  #
  # cypress/included already carries Chrome, Firefox, Electron, and every
  # library they need, so nothing has to be installed on the host. What it
  # lacks is somewhere to draw, and mounting the X socket supplies that:
  # WSLg on Windows 11, or a native X server on Linux. Specs bind-mount rather
  # than copy, so editing one reruns it without rebuilding the image.
  cypress-open:
    build:
      context: .
      dockerfile: docker/cypress.Dockerfile
    profiles: ["e2e-open"]
    environment:
      DISPLAY: ${DISPLAY:-:0}
      CYPRESS_DASHBOARD_BASE_URL: http://app:8000
      CYPRESS_GATEWAY_BASE_URL: http://gateway:8080
      CYPRESS_SETTLEMENT_BASE_URL: http://settlement:8082
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./cypress-tests/cypress:/suite/cypress
      - ./cypress-tests/cypress.config.ts:/suite/cypress.config.ts:ro
    # Chrome maps a large shared-memory segment and crashes partway through a
    # run against Docker's 64MB default.
    shm_size: 2gb
    command: ["npx", "cypress", "open", "--e2e"]

  # Every suite, runnable with Docker alone. A reviewer reproduces the numbers
  # rather than taking them on faith, without installing Go, Node, PHP,
  # Composer, or a coverage driver.
  test-go:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      target: test
    profiles: ["test"]
    environment:
      TEST_POSTGRES_DSN: postgres://agentic:agentic@postgres:5432/agentic?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  test-ts:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: test
    profiles: ["test"]

  test-php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: test
    profiles: ["test"]

  # Mutation runs, same images with a different command. Slower by an order of
  # magnitude, which is why they sit behind their own profile.
  mutate-ts:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: test
    profiles: ["mutate"]
    command:
      - sh
      - -c
      - >-
        npx stryker run packages/types/stryker.conf.json &&
        npx stryker run stryker.gateway.json &&
        npx stryker run facilitator/stryker.conf.json &&
        npx stryker run stryker.merchant.json &&
        npx stryker run stryker.simulator.json

  mutate-php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: test
    profiles: ["mutate"]
    command: ["./vendor/bin/infection", "--threads=4", "--no-progress", "--no-interaction"]

volumes:
  postgres-data:
  opensearch-data:
  seed-data:
